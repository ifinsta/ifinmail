name: Android release

# Builds a signed ifinmail Android release and publishes it to your own server, where every
# installed device picks it up over the air. Manual on purpose: a release is a decision.
# Needs the repository secrets listed in docs/android-releases.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, MAJOR.MINOR.PATCH (build number is derived: 1.4.2 -> 10402)'
        required: true
      channel:
        description: 'Channel'
        type: choice
        options: [stable, beta]
        default: stable
      rollout:
        description: 'Percent of devices that are offered it (0-100)'
        default: '100'
      mandatory:
        description: 'Force older installs to update (blocks them until they do)'
        type: boolean
        default: false
      dry_run:
        description: 'Build and check only; upload nothing'
        type: boolean
        default: false
      notes:
        description: 'What is new (Markdown)'
        required: false

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release # add required reviewers to this environment for a second pair of eyes
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 is not set" >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ifinmail-release.jks"
          echo "IFINMAIL_KEYSTORE_FILE=$RUNNER_TEMP/ifinmail-release.jks" >> "$GITHUB_ENV"

      - name: Build, check and publish
        env:
          IFINMAIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IFINMAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IFINMAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IFINMAIL_API_TOKEN: ${{ secrets.IFINMAIL_API_TOKEN }}
          IFINMAIL_SERVER: ${{ vars.IFINMAIL_SERVER }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          ROLLOUT: ${{ inputs.rollout }}
          MANDATORY: ${{ inputs.mandatory }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(release --version "$VERSION" --channel "$CHANNEL" --rollout "$ROLLOUT" --notes "$NOTES")
          if [ "$MANDATORY" = "true" ]; then args+=(--mandatory --yes); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python clients/android/scripts/release.py "${args[@]}"

      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ifinmail-android-${{ inputs.version }}
          path: |
            clients/android/dist/*.apk
            clients/android/dist/*.sha256
          if-no-files-found: ignore
          retention-days: 30
