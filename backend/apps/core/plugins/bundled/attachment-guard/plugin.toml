manifest_version = 2

[plugin]
id = "attachment-guard"
name = "Attachment guard"
version = "2.0.0"
publisher = "ifinmail"
category = "security"
summary = "Stop executables, scripts, disk images and macro-enabled Office files from arriving or leaving as attachments."
requires_core = "0.0.10"
description = """
Most malware arrives as an attachment: a program, a script, a disk image or an Office document with macros. Ordinary people almost never need to send these by email, so blocking them closes the most common way in at very little cost.

The spam filter checks both the file name and the actual content of every attachment, including files inside archives, so a program renamed to invoice.pdf is still caught. Choose whether such messages are refused (the sender is told why) or delivered to the recipient's Junk folder.

If a team genuinely exchanges one of these types, remove it from the list. Plain documents, PDFs, images and archives are not on the default list.
"""

[[settings]]
key = "blocked_types"
type = "text"
label = "Blocked file types"
help = "File extensions separated by commas. Capitals and leading dots are fine."
max_length = 500
default = "exe, scr, com, bat, cmd, pif, cpl, msi, msp, msc, jar, js, jse, vbs, vbe, wsf, wsh, ps1, psm1, hta, lnk, reg, iso, img, vhd, vhdx, docm, dotm, xlsm, xlam, pptm, one"

[[settings]]
key = "action"
type = "choice"
label = "When one is found"
options = ["reject", "quarantine"]
default = "reject"
help = "reject: the message is refused and the sender is told why. quarantine: it is delivered to Junk."

[[contributes]]
capability = "inbound.attachments"
values = { block_types = "{blocked_types}", action = "{action}" }
