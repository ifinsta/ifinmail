manifest_version = 2

[plugin]
id = "mail-policy"
name = "Mail policy essentials"
version = "2.0.0"
publisher = "ifinmail"
category = "operations"
summary = "Block and allow lists, sending limits, message size, internal-only mailboxes, greylisting and quota warnings, with provider-grade defaults."
requires_core = "0.0.10"
description = """
One place for the controls administrators reach for in their first weeks, with defaults taken from what Google Workspace and Microsoft 365 do, so installing it with no changes is safe. Every list starts empty and changes nothing until you add to it.

Sending limits default to 30 messages a minute and 2,000 a day per login, the same order as Microsoft 365's per-minute limit and Google Workspace's daily limit, so one stolen password cannot send a flood. Messages up to 50 MB are accepted and sent, the size this server already allowed and what Gmail Enterprise allows. Users get a notice in their Inbox at 80% and 95% of their quota, before mail to them starts bouncing.

The allow list follows Microsoft's guidance that allow entries are a risk: a listed sender counts only when SPF or DKIM proves the message really comes from them, and attachment and malware rules still apply. Review it from time to time and remove what is no longer needed. Blocked senders are refused whether they appear in the envelope or the From header. Internal-only mailboxes (interns, shared desks, service accounts) can send only to domains hosted on this server.

Greylisting asks suspicious first-time senders to try again a few minutes later; it applies only to mail that already looks doubtful, and allow-listed senders are never greylisted.
"""

[[settings]]
key = "block_senders"
type = "text"
label = "Blocked senders"
help = "Addresses or whole domains, separated by commas. Mail from them is refused."
max_length = 500

[[settings]]
key = "allow_senders"
type = "text"
label = "Allowed senders"
help = "Addresses or domains never treated as spam, when SPF or DKIM proves they sent it."
max_length = 500

[[settings]]
key = "internal_only"
type = "text"
label = "Internal-only mailboxes"
help = "Mailboxes that may send only to domains hosted here, separated by commas."
max_length = 500

[[settings]]
key = "send_per_minute"
type = "integer"
label = "Messages per login per minute"
min = 1
max = 1000
default = 30

[[settings]]
key = "send_per_day"
type = "integer"
label = "Messages per login per day"
min = 1
max = 100000
default = 2000

[[settings]]
key = "message_size_mb"
type = "integer"
label = "Largest message (MB)"
min = 1
max = 50
default = 50
help = "Attachments included. Attachments grow by about a third when sent, so 50 MB fits a 35 MB file. 50 MB is the most the spam filter scans and signs."

[[settings]]
key = "greylisting"
type = "boolean"
label = "Greylisting"
default = true
help = "On: suspicious first-time senders retry after a few minutes. Off: never delay mail."

[[settings]]
key = "quota_warnings"
type = "boolean"
label = "Warn users at 80% and 95% of their quota"
default = true

[[contributes]]
capability = "inbound.senders"
values = { block = "{block_senders}", allow = "{allow_senders}" }

[[contributes]]
capability = "inbound.greylisting"
values = { enabled = "{greylisting}" }

[[contributes]]
capability = "sending.rate_limit"
values = { per_minute = "{send_per_minute}", per_day = "{send_per_day}" }

[[contributes]]
capability = "mail.limits"
values = { max_message_mb = "{message_size_mb}" }

[[contributes]]
capability = "sending.internal_only"
values = { mailboxes = "{internal_only}" }

[[contributes]]
capability = "mailbox.quota_warnings"
values = { enabled = "{quota_warnings}" }
