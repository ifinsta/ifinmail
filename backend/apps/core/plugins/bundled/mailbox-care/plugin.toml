manifest_version = 2

[plugin]
id = "mailbox-care"
name = "Mailbox care"
version = "1.0.0"
publisher = "ifinmail"
category = "operations"
summary = "Empty Trash and Junk after a set number of days, and warn people before their mailbox is full."
requires_core = "0.0.11"
description = """
Deleted mail and spam pile up: on a small server they are often the largest part of what is stored, and they count against everyone's quota. Most organisations also have a rule that deleted data should not be kept longer than necessary.

Messages are removed from Trash and Junk once they have been there longer than the number of days you choose. You can also expire Sent mail; leave that empty to keep it. Inbox and other folders are never touched, and removal happens a little at a time as people use their mailboxes, so there is no nightly load. Copies kept by the Compliance journal are in the archive mailbox's Inbox and are not affected.

People get a notice in their Inbox at 80% and 95% of their quota, before mail to them starts bouncing. The notice is delivered even when the mailbox is already full.
"""

[[settings]]
key = "trash_days"
type = "integer"
label = "Empty Trash after (days)"
min = 1
max = 3650
default = 30
help = "Leave empty to keep Trash."

[[settings]]
key = "junk_days"
type = "integer"
label = "Empty Junk after (days)"
min = 1
max = 3650
default = 30
help = "Leave empty to keep Junk."

[[settings]]
key = "sent_days"
type = "integer"
label = "Remove Sent mail after (days)"
min = 1
max = 3650
help = "Leave empty to keep Sent mail."

[[settings]]
key = "quota_warnings"
type = "boolean"
label = "Warn people at 80% and 95% of their quota"
default = true

[[contributes]]
capability = "mailbox.retention"
values = { trash_days = "{trash_days}", junk_days = "{junk_days}", sent_days = "{sent_days}" }

[[contributes]]
capability = "mailbox.quota_warnings"
values = { enabled = "{quota_warnings}" }
