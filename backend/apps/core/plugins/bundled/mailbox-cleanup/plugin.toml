manifest_version = 1

[plugin]
id = "mailbox-cleanup"
name = "Mailbox cleanup"
version = "1.0.0"
publisher = "ifinmail"
category = "operations"
summary = "Empty Trash and Junk automatically after a set number of days, and optionally old Sent mail, to keep disks and quotas healthy."
requires_core = "0.0.5"
description = """
Deleted mail and spam pile up: on a small server they are often the largest part of what is stored, and they count against everyone's quota. Most organisations also have a rule that deleted data should not be kept longer than necessary.

This plugin makes Dovecot remove messages from Trash and Junk once they have been there longer than the number of days you choose. You can also expire Sent mail; leave that empty to keep it. Inbox and other folders are never touched.

Removal happens as people use their mailboxes, a little at a time, so there is no nightly load. Messages kept by the Compliance journal plugin are in the archive mailbox's Inbox and are not affected.
"""

[[settings]]
key = "trash_days"
type = "integer"
label = "Empty Trash after (days)"
min = 1
max = 3650
default = 30

[[settings]]
key = "junk_days"
type = "integer"
label = "Empty Junk after (days)"
min = 1
max = 3650
default = 30

[[settings]]
key = "sent_days"
type = "integer"
label = "Remove Sent mail after (days)"
min = 1
max = 3650
help = "Leave empty to keep Sent mail."

[[contributes]]
point = "dovecot.policy"
values = { autoexpunge_trash_days = "{trash_days}", autoexpunge_junk_days = "{junk_days}", autoexpunge_sent_days = "{sent_days}" }
