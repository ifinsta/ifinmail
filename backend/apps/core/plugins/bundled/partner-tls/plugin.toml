manifest_version = 2

[plugin]
id = "partner-tls"
name = "Partner TLS"
version = "2.0.0"
publisher = "ifinmail"
category = "compliance"
summary = "Require encrypted delivery to named partner domains, so mail to your bank, lawyers or regulators is never sent in plain text."
requires_core = "0.0.10"
description = """
By default mail servers encrypt when the other side supports it and fall back to plain text when it does not. For most mail that is the right trade-off. For some partners it is not: contracts and regulators often require that messages to them are always encrypted in transit.

For the domains you list, this server refuses to send unencrypted. If a partner's server cannot do TLS, the message waits in the queue and is retried rather than going out in the clear, and the sender is told if it cannot be delivered.

Requiring a valid certificate as well means the partner's server must prove it belongs to the domain; turn it on only for partners whose mail servers are named within their own domain, because servers hosted by large providers often are not.
"""

[[settings]]
key = "domains"
type = "text"
label = "Partner domains"
help = "Domains separated by commas, for example bank.example, law-firm.example."
max_length = 500
required = true

[[settings]]
key = "verify_certificate"
type = "boolean"
label = "Also require a valid certificate"
help = "Off: encryption is required. On: the partner's server must also prove its identity with a valid certificate."
default = false

[[contributes]]
capability = "delivery.require_tls"
values = { domains = "{domains}", verify_certificate = "{verify_certificate}" }
