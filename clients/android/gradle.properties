#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# In-house updates (over the air). Builds ask this server for new versions; leave empty to disable,
# or override per build: -Pifinmail.updateBaseUrl=https://mail.example.org
ifinmail.updateBaseUrl=https://mail.ifinsta.online
ifinmail.updateChannel=stable
# Version of the build being made; raise ifinmail.versionCode for every published build.
ifinmail.versionCode=10100
ifinmail.versionName=1.1.0
