{% load i18n %}
<tr>
    <td data-label="{% trans 'Address' %}"><code class="ifinmail-text--mono">{{ item.row.address }}</code></td>
    <td>{{ item.quota_label }}</td>
    <td>{% if item.row.is_admin %}<span class="ifinmail-badge ifinmail-badge--info">{% trans 'Admin' %}</span>{% else %}{% trans 'User' %}{% endif %}</td>
    <td>{% if item.row.is_active %}<span class="ifinmail-badge ifinmail-badge--success">{% trans 'Active' %}</span>{% else %}<span class="ifinmail-badge ifinmail-badge--warning">{% trans 'Disabled' %}</span>{% endif %}</td>
    <td>
        <button type="button" class="ifinmail-link-strong" data-action="open-manage-mailbox" data-id="{{ item.row.id }}" data-address="{{ item.row.address }}" data-quota-mb="{{ item.quota_mb }}" data-active="{% if item.row.is_active %}1{% else %}0{% endif %}" data-invite-pending="{% if item.row.invite_pending %}1{% else %}0{% endif %}">{% trans 'Manage' %}<span class="ifinmail-sr-only"> {{ item.row.address }}</span></button>
    </td>
</tr>
