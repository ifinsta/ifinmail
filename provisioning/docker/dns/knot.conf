# Static Knot DNS configuration. The zones, secondaries and per-zone options are generated by
# the console into /runtime/dns/knot.generated.conf (included last).
server:
    rundir: /run/knot
    user: knot:knot
    listen: [0.0.0.0@53, "::@53"]
    version: ""
    identity: ""
    tcp-reuseport: on

log:
  - target: stdout
    any: info

database:
    storage: /var/lib/knot

mod-rrl:
  - id: default
    rate-limit: 200
    slip: 2

policy:
  - id: ifinmail
    algorithm: ecdsap256sha256
    nsec3: on
    zsk-lifetime: 30d
    ksk-lifetime: 0

template:
  - id: default
    storage: /var/lib/knot
    dnssec-signing: on
    dnssec-policy: ifinmail
    zonefile-load: difference-no-serial
    zonefile-sync: -1
    journal-content: all
    serial-policy: unixtime
    semantic-checks: on
    global-module: mod-rrl/default

include: /runtime/dns/knot.generated.conf
