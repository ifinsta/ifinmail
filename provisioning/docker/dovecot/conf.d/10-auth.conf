# Dovecot 10-auth.conf — authentication for ifinmail
#
# Without this include Dovecot starts with NO passdb/userdb (auth-sql.conf.ext does not
# match the "conf.d/*.conf" glob in dovecot.conf), so no one could sign in over IMAP
# and Postfix SASL (submission) would reject every login.
auth_mechanisms = plain login
disable_plaintext_auth = yes

# Case-insensitive logins: users sign in with their full address.
auth_username_format = %Lu

# The console (api and worker containers) reads agent inboxes and watched mailboxes over IMAP as
# a master user: "<mailbox>*ifinmail-console" with DOVECOT_MASTER_PASSWORD. The entrypoint writes
# the master-users file from that variable (empty when it is not set, so no master login exists),
# and the entry only works from private networks (the Docker network), never from the internet.
auth_master_user_separator = *
passdb {
  driver = passwd-file
  master = yes
  args = /etc/dovecot/master-users
  # Look the target mailbox up in the normal passdb too, so a master login only reaches mailboxes
  # that exist and are enabled.
  pass = yes
}

!include auth-sql.conf.ext
