# Dovecot 20-pop3.conf — POP3 protocol settings for ifinmail

protocol pop3 {
  # Stable per-message ids: clients use UIDL to know what they already downloaded.
  # (uid + uidvalidity; must not change once mail has been fetched)
  pop3_uidl_format = %08Xu%08Xv

  # Outlook Express / old Outlook quirks
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh

  mail_max_userip_connections = 10
}
