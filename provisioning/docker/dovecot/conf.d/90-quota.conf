# Dovecot 90-quota.conf — per-mailbox storage quota for ifinmail
#
# The limit for each mailbox is read from mailboxes.quota_bytes by the userdb query
# (userdb_quota_rule, "*:bytes=N"). N = 0 means unlimited.
plugin {
  quota = maildir:User quota
  quota_rule = *:bytes=0
  quota_grace = 10%%
  quota_vsizes = yes
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}
