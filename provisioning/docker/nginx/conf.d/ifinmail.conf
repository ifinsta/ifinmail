# ifinmail nginx reverse proxy

# --- Rate limiting zones ---
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# --- Access log for the console's threat digest (backend/apps/core/telemetry/threats) ---
# One JSON object per line in a volume the worker reads (read-only). It is separate from the
# access log on stdout, which `docker logs` keeps showing. log-rotate.sh caps its size.
# "cid" is $request_id and is also sent to the console as X-Correlation-ID (below), so one request
# can be followed from here to an error or audit record.
log_format ifinmail_json escape=json
    '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","uri":"$request_uri",'
    '"st":$status,"b":$body_bytes_sent,"rt":$request_time,"h":"$host","p":"$server_protocol",'
    '"ua":"$http_user_agent","ref":"$http_referer","cid":"$request_id"}';
access_log /var/log/ifinmail/access.json ifinmail_json;

# --- HTTP → HTTPS redirect (except ACME challenges) ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge for Certbot (before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

}

# --- HTTPS main site ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS — certs from Certbot via shared volume
    ssl_certificate     /etc/letsencrypt/live/__SSL_CERT_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SSL_CERT_HOSTNAME__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP stapling needs a trusted issuer chain; enable after certbot has a full chain.
    ssl_stapling off;
    ssl_stapling_verify off;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;";

    # Client max body size (email attachments)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # Connection limits
    limit_conn connlimit 50;

    # Hardening: never proxy upstream errors — let Django render its own error pages
    proxy_intercept_errors off;

    # Custom error pages — served from static files (no upstream dependency)
    # Only fires for nginx-generated errors (upstream down, rate limited, request too large, etc.)
    error_page 400 401 402 403 404 405 406 408 410 411 413 414 415 416 429 /static/error-pages/40x.html;
    error_page 500 502 503 504 /static/error-pages/50x.html;

    location /static/error-pages/ {
        alias /app/staticfiles/error-pages/;
        add_header X-Robots-Tag "noindex, nofollow" always;
        internal;
    }

    # API proxy
    location / {
        # Apply general rate limit, burst of 20
        limit_req zone=general burst=20 nodelay;
        limit_conn connlimit 50;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts (prevent hanging connections)
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy buffers (handle large responses)
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;

        # Proxy redirect fix
        proxy_redirect http://api:8000/ https://$host/;
    }

    # Rate-limited admin panel
    location /manage-panel/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Accounts app (moderate rate limit)
    location /admin/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-domain client configuration and the MTA-STS policy, for every hosted domain.
    # The api sees the mail hostname as Host (ALLOWED_HOSTS stays strict) and learns
    # which hostname the client used from X-Original-Host. nginx always overwrites
    # that header, so a client cannot spoof it.
    location = /.well-known/mta-sts.txt {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host __SSL_CERT_HOSTNAME__;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Email client autoconfiguration (Thunderbird / Outlook / Apple Mail)
    location ~* ^/(\.well-known/autoconfig/mail/config-v1\.1\.xml|mail/config-v1\.1\.xml|autodiscover/autodiscover\.xml)$ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host __SSL_CERT_HOSTNAME__;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CalDAV / CardDAV (Radicale). Resolved at request time so nginx still starts if it is down.
    # RFC 6764: clients look for /.well-known/caldav and /.well-known/carddav first.
    location = /.well-known/caldav  { return 301 /dav/; }
    location = /.well-known/carddav { return 301 /dav/; }
    location = /dav { return 301 /dav/; }
    location /dav/ {
        limit_req zone=login burst=30 nodelay;
        resolver 127.0.0.11 valid=10s;
        set $dav_upstream http://dav:5232;
        rewrite ^/dav/(.*)$ /$1 break;
        proxy_pass $dav_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Script-Name /dav;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # Static files (from shared volume with API container)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media (branding uploads: logo, favicon)
    location /media/ {
        alias /app/media/;
    }
}
