# ifinmail resolver: recursive, caching, reachable only from the stack's private networks.
server:
    verbosity: 0
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # Small and quick: this serves one spam filter.
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m
    cache-min-ttl: 60
    prefetch: yes
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    # Private answers are refused (DNS rebinding), but 127.0.0.0/8 is not listed on purpose:
    # DNS blocklists answer 127.0.0.x to say "listed".
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    # No query log: the healthcheck and normal lookups are not worth a line.
    log-queries: no
    log-replies: no
