# Rspamd action thresholds - tuned for ifinmail
# Increase defaults slightly to reduce false positives initially. These are the values at
# sensitivity 5 on Spam Filtering; the console writes the four thresholds for any other setting
# and ifinmail-rspamd-sync renders them into the file included below (add_header is the one
# spelling of that key, so the two files merge instead of defining it twice).
greylist = 4.0;
add_header = 6.0;
rewrite_subject = 8.0;
reject = 15.0;

.include(try=true; priority=5; duplicate=merge) "/var/lib/ifinmail-rspamd/actions.conf"
