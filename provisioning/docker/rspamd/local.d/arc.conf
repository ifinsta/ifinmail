# ARC (Authenticated Received Chain). Rspamd verifies ARC chains by default. Trusted sealers and
# sealing of forwarded mail come from the ARC trusted forwarding plugin, rendered by
# ifinmail-rspamd-sync into /var/lib/ifinmail-rspamd; the fragment is empty unless it is enabled.
.include(try=true; priority=5; duplicate=merge) "/var/lib/ifinmail-rspamd/arc.conf"
