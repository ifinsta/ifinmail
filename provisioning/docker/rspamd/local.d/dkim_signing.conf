# DKIM signing for every hosted domain.
#
# The console generates one key per domain and writes it to /etc/dkim as
# <domain>.<selector>.key, so adding a domain needs no change here: Rspamd
# signs as soon as the file exists, and skips domains that have no key.
enabled = true;
selector = "default";
path = "/etc/dkim/$domain.$selector.key";
allow_username_mismatch = true;
sign_local = true;
use_esld = false;
# The global path/selector below are the *fallback* used for every domain; rspamd ignores
# them ("dkim unconfigured and fallback disabled") unless this is true.
try_fallback = true;
use_domain = "header";
