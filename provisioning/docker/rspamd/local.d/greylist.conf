# Rspamd greylisting — temp-fail unknown sender/recipient/IP tuples
# Backed by Redis for persistence across restarts
enabled = true;
expire = 1d;
timeout = 5min;
key_prefix = "rgrey:";
# Honor whitelists before greylisting
check_whitelist = true;

# Greylisting switch and allow-list exemption from the Mail policy plugin (empty unless enabled).
.include(try=true; priority=5; duplicate=merge) "/var/lib/ifinmail-rspamd/greylist.conf"
