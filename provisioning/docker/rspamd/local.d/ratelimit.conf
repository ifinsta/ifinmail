# Outbound abuse containment: one stolen mailbox password must not be able to burn this
# server's IP reputation. Limits apply to AUTHENTICATED senders only (Postfix passes the login
# in {auth_authen}); inbound mail from the internet is unaffected. Exceeding a limit
# temporarily rejects further sends (4xx) until the bucket refills; mail already queued is
# not lost, and legitimate clients retry.
#
# Tune the numbers to your largest legitimate sender, not the average one.
rates {
  # Per login: a burst of 100, refilling at 100 per hour (about 2,400 a day).
  user {
    selector = "user";
    bucket = {
      burst = 100;
      rate = "100 / 1h";
    }
  }
  # Per login and recipient domain: stops one account from flooding a single provider.
  user_to_domain {
    selector = "user.lower, rcpt_domain";
    bucket = {
      burst = 40;
      rate = "40 / 1h";
    }
  }
}

# Per-login limits from the Mail policy plugin replace the rates above when it is enabled
# (an empty fragment changes nothing).
.include(try=true; priority=5; duplicate=replace) "/var/lib/ifinmail-rspamd/ratelimit.conf"
