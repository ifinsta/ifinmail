# Extra DNS lists added on Spam Filtering. Rendered by ifinmail-rspamd-sync into
# /var/lib/ifinmail-rspamd and included here; the file is empty unless lists were added. The
# lists Rspamd ships with (Spamhaus, Mailspike, DNSWL and others) stay as they are.
.include(try=true; priority=5; duplicate=merge) "/var/lib/ifinmail-rspamd/rbl.conf"
